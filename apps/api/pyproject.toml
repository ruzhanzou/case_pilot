[project]
name = "casepilot-api"
version = "1.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.15"
dependencies = ["openai-agents>=0.8,<0.9", "openai==2.44.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
