[project]
name = "casepilot-agent"
version = "1.0.0"
description = "CasePilot test-case generation agent"
license = "Apache-2.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "celery[redis]>=5.6,<6",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
  "sqlalchemy>=2.0,<3",
  "pgvector>=0.4,<1",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "pytesseract>=0.3.13,<1",
  "jieba>=0.42,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
