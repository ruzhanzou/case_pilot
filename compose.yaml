name: casepilot

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casepilot}
      POSTGRES_USER: ${POSTGRES_USER:-casepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casepilot-local}
    ports:
      - "5432:5432"
    volumes:
      - casepilot_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casepilot} -d ${POSTGRES_DB:-casepilot}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - casepilot_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://casepilot:casepilot-local@postgres:5432/casepilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://casepilot:casepilot-local@postgres:5432/casepilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CASEPILOT_AGENT_PROVIDER: ${CASEPILOT_AGENT_PROVIDER:-mock}
      CASEPILOT_AGENT_BASE_URL: ${CASEPILOT_AGENT_BASE_URL:-https://api.openai.com/v1}
      CASEPILOT_AGENT_API_KEY: ${CASEPILOT_AGENT_API_KEY:-}
      CASEPILOT_AGENT_MODEL: ${CASEPILOT_AGENT_MODEL:-gpt-4.1-mini}
      CASEPILOT_AGENT_TIMEOUT_SECONDS: ${CASEPILOT_AGENT_TIMEOUT_SECONDS:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: node:24-alpine
    working_dir: /workspace/apps/web
    command: ["sh", "-lc", "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"]
    environment:
      NEXT_PUBLIC_CASEPILOT_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - casepilot_node_modules:/workspace/apps/web/node_modules
    depends_on:
      - api

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://casepilot:casepilot-local@postgres:5432/casepilot}
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  casepilot_postgres:
  casepilot_redis:
  casepilot_node_modules:
