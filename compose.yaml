name: casepilot

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casepilot}
      POSTGRES_USER: ${POSTGRES_USER:-casepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casepilot-local}
    ports:
      - "5432:5432"
    volumes:
      - casepilot_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casepilot} -d ${POSTGRES_DB:-casepilot}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - casepilot_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: casepilot-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://casepilot:casepilot-local@postgres:5432/casepilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CASEPILOT_KNOWLEDGE_STORAGE_PATH: ${CASEPILOT_KNOWLEDGE_STORAGE_PATH:-/var/lib/casepilot/knowledge}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - casepilot_knowledge:/var/lib/casepilot/knowledge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  agent:
    image: casepilot-agent:local
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://casepilot:casepilot-local@postgres:5432/casepilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CASEPILOT_KNOWLEDGE_STORAGE_PATH: ${CASEPILOT_KNOWLEDGE_STORAGE_PATH:-/var/lib/casepilot/knowledge}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - casepilot_knowledge:/var/lib/casepilot/knowledge
    restart: unless-stopped

  cleanup:
    image: casepilot-agent:local
    command: ["celery", "-A", "casepilot_agent.tasks:celery_app", "beat", "--loglevel=INFO"]
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://casepilot:casepilot-local@postgres:5432/casepilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CASEPILOT_KNOWLEDGE_STORAGE_PATH: ${CASEPILOT_KNOWLEDGE_STORAGE_PATH:-/var/lib/casepilot/knowledge}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - casepilot_knowledge:/var/lib/casepilot/knowledge
    restart: unless-stopped

  web:
    image: node:24-slim
    working_dir: /workspace/apps/web
    command: ["sh", "-lc", "corepack enable && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"]
    environment:
      CI: "true"
      NEXT_PUBLIC_CASEPILOT_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - casepilot_root_node_modules:/workspace/node_modules
      - casepilot_node_modules:/workspace/apps/web/node_modules
    depends_on:
      api:
        condition: service_healthy

  migrate:
    image: casepilot-api:local
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://casepilot:casepilot-local@postgres:5432/casepilot}
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  casepilot_postgres:
  casepilot_redis:
  casepilot_root_node_modules:
  casepilot_node_modules:
  casepilot_knowledge:
